[workspace]
resolver = "2"
members = [
    "crates/scoplen-server",
    "crates/scoplen-identity",
    "crates/scoplen-sync",
    "crates/scoplen-control",
    "crates/scoplen-ca",
    "crates/scoplen-gateway",
    "crates/scoplen-audit",
    "crates/scoplen-store",
    "crates/scoplen-agent",
    "crates/scoplen-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"
authors = ["Scoplen maintainers"]

[workspace.dependencies]
axum = { version = "0.8.4", features = ["ws"] }
bytes = "1.10.1"
clap = { version = "4.5.35", features = ["derive", "env"] }
futures-util = "0.3.31"
getrandom = "0.3.2"
hyper-util = { version = "0.1.12", features = ["server", "tokio", "http1", "http2"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws", "fs"] }
rcgen = "0.13.2"
rustls = "0.23.25"
rustls-pemfile = "2.2.0"
semver = "1.0.28"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util", "fs", "sync"] }
tokio-rustls = "0.26.2"
toml = "0.8.20"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
uuid = { version = "1.16.0", features = ["v4"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["aws-lc-rs", "tls12", "tokio", "webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
