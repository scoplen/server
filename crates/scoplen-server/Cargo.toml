[package]
name = "scoplen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's self-hosted server binary and role supervisor."

[[bin]]
name = "spl-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
http-body-util = "0.1.3"
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
scoplen-api = { git = "https://github.com/scoplen/proto.git", rev = "4a5d6026fb72cd8dbb2346db60cb16d7266a9ab3" }
scoplen-crypto = { git = "https://github.com/scoplen/proto.git", rev = "4a5d6026fb72cd8dbb2346db60cb16d7266a9ab3" }
scoplen-identity = { path = "../scoplen-identity" }
scoplen-store = { path = "../scoplen-store" }
scoplen-sync = { path = "../scoplen-sync" }
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting"] }
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls-acme.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
scoplen-audit = { path = "../scoplen-audit" }

[lints]
workspace = true

[features]
postgres-integration = []

[dev-dependencies]
ed25519-dalek.workspace = true
scoplen-model = { git = "https://github.com/scoplen/proto.git", rev = "4a5d6026fb72cd8dbb2346db60cb16d7266a9ab3" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
