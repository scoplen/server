[package]
name = "scoplen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's self-hosted server binary and role supervisor."

[[bin]]
name = "spl-server"
path = "src/main.rs"

[[example]]
name = "personal_live_bootstrap"
path = "examples/personal_live_bootstrap.rs"
test = true

[dependencies]
async-trait = "0.1.92"
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
http-body-util = "0.1.3"
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
scoplen-api = { git = "https://github.com/scoplen/proto.git", rev = "1e9e720b4935849cd81ac6068821d469ee3577ac" }
scoplen-crypto = { git = "https://github.com/scoplen/proto.git", rev = "1e9e720b4935849cd81ac6068821d469ee3577ac" }
scoplen-identity = { path = "../scoplen-identity" }
scoplen-store = { path = "../scoplen-store" }
scoplen-sync = { path = "../scoplen-sync" }
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting"] }
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls-acme.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
scoplen-audit = { path = "../scoplen-audit" }
scoplen-control = { version = "0.1.0", path = "../scoplen-control" }

[lints]
workspace = true

[features]
postgres-integration = []

[dev-dependencies]
base64 = "0.22.1"
ciborium = "0.2.2"
ed25519-dalek.workspace = true
hyper = { version = "1.12.0", features = ["client", "http2"] }
scoplen-model = { git = "https://github.com/scoplen/proto.git", rev = "1e9e720b4935849cd81ac6068821d469ee3577ac" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
url = "2.5.8"
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
webauthn-rs-core = "=0.5.5"
zeroize.workspace = true
