[package]
name = "scoplen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's self-hosted server binary and role supervisor."

[[bin]]
name = "spl-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
scoplen-store = { path = "../scoplen-store" }
scoplen-sync = { path = "../scoplen-sync" }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls-acme.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
scoplen-audit = { path = "../scoplen-audit" }

[lints]
workspace = true

[features]
postgres-integration = []

[dev-dependencies]
ed25519-dalek.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
