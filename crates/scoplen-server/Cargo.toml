[package]
name = "scoplen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's self-hosted server binary and role supervisor."

[[bin]]
name = "spl-server"
path = "src/main.rs"

[[example]]
name = "personal_live_bootstrap"
path = "examples/personal_live_bootstrap.rs"
test = true

[dependencies]
async-trait = "0.1.92"
axum.workspace = true
base64 = "0.22.1"
clap.workspace = true
getrandom.workspace = true
http-body-util = "0.1.3"
hyper-util.workspace = true
ipnet = "2.12.2"
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
scoplen-api = { git = "https://github.com/scoplen/proto.git", rev = "1d3817fe656a40e6840a42c9d7828881dcd928fe" }
scoplen-crypto = { git = "https://github.com/scoplen/proto.git", rev = "1d3817fe656a40e6840a42c9d7828881dcd928fe", features = ["portable-export"] }
scoplen-identity = { path = "../scoplen-identity" }
scoplen-store = { path = "../scoplen-store" }
scoplen-sync = { path = "../scoplen-sync" }
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting"] }
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-log = "0.2.0"
tracing-subscriber.workspace = true
rustls-acme.workspace = true
tokio-stream.workspace = true
url = "2.5.8"
uuid.workspace = true
scoplen-audit = { path = "../scoplen-audit" }
zeroize.workspace = true

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[features]
postgres-integration = []

[dev-dependencies]
ciborium = "0.2.2"
ed25519-dalek.workspace = true
futures-util.workspace = true
hyper = { version = "1.12.0", features = ["client", "http2"] }
scoplen-model = { git = "https://github.com/scoplen/proto.git", rev = "1d3817fe656a40e6840a42c9d7828881dcd928fe" }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
time = { version = "0.3.55", features = ["parsing"] }
tokio-tungstenite = "0.26.2"
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
webauthn-rs-core = "=0.5.5"
