[package]
name = "scoplen-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen storage abstraction."

[lints]
workspace = true

[dependencies]
scoplen-audit = { path = "../scoplen-audit" }
scoplen-api = { git = "https://github.com/scoplen/proto.git", rev = "e2dd140e06302d75d863c36e9dcba57a4b2562d1" }
scoplen-identity = { path = "../scoplen-identity" }
scoplen-crypto = { git = "https://github.com/scoplen/proto.git", rev = "e2dd140e06302d75d863c36e9dcba57a4b2562d1" }
bytes.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
object_store.workspace = true
sha2.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }
zeroize.workspace = true
serde_json.workspace = true
base64 = "0.22.1"

[dev-dependencies]
tokio.workspace = true
url = "2.5.8"
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
ciborium = "0.2.2"
webauthn-rs-core = "=0.5.5"

[features]
postgres-integration = []
