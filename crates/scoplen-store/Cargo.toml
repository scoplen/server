[package]
name = "scoplen-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen storage abstraction."

[lints]
workspace = true

[dependencies]
scoplen-audit = { path = "../scoplen-audit" }
scoplen-identity = { path = "../scoplen-identity" }
scoplen-crypto = { git = "https://github.com/scoplen/proto.git", rev = "e288515" }
bytes.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
object_store.workspace = true
sha2.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
scoplen-api = { git = "https://github.com/scoplen/proto.git", rev = "e288515" }
tokio.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
postgres-integration = []
