name: scoplen-postgres

services:
  server:
    environment:
      SPL_STORAGE_BACKEND: postgres
      SPL_STORAGE_DATABASE_URL: postgres://scoplen:${SCOPLEN_POSTGRES_PASSWORD:?Set SCOPLEN_POSTGRES_PASSWORD to a private URL-safe password}@postgres:5432/scoplen
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: scoplen
      POSTGRES_USER: scoplen
      POSTGRES_PASSWORD: ${SCOPLEN_POSTGRES_PASSWORD:?Set SCOPLEN_POSTGRES_PASSWORD to a private URL-safe password}
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoplen -d scoplen"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
