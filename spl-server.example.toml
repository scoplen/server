# Copy to spl-server.toml and adjust for the deployment.

[server]
listen_addr = "127.0.0.1"
listen_port = 8443
# Externally reachable HTTPS host and port; independent of the local listener.
# Use a lowercase DNS name, canonical IPv4, or unbracketed canonical IPv6.
public_host = "localhost"
public_port = 443
# Windows: private creation/ACL admission requires OS PowerShell 5.1; see docs/windows-data-directory.md.
data_dir = "./data"

[tls]
# Use "plain" behind a trusted TLS reverse proxy, or "files" for direct TLS.
mode = "plain"
# Contact address is required in acme mode. Set production=false for Let's Encrypt staging.
# acme_email = "operator@example.com"
# acme_production = true
trusted_proxies = []

[roles]
names = ["all"]

[console]
# Build with pnpm --dir web/console build. Relative to the process working directory.
# Installed packages must ship this directory and configure its installed path.
assets_dir = "web/console/dist"

[sync]
# Positive platform-representable write bounds may be raised or lowered from these defaults.
max_envelope_bytes = 266240
max_batch_objects = 500
max_batch_bytes = 4194304
# Independent read budgets: keep these large enough for retained data after lowering writes.
max_read_envelope_bytes = 266240
max_read_body_bytes = 266295039
# Relational cardinality limits. Session handshakes advertise values enforced by the store.
max_objects_per_vault = 100000
max_shared_vaults_per_account = 1000
# Keep this at or below 1000 so a new epoch can include one wrap per member.
max_members_per_shared_vault = 1000
# Per-device object-write token bucket. Both values must be positive.
write_requests_per_second = 50
write_burst = 200

[storage]
# Database-backed roles can use PostgreSQL with database_url.
backend = "sqlite"
# database_url = "postgres://scoplen:change-me@db.example.com/scoplen"

[storage.kms]
# The local backend reads data_dir/deployment.key unless an explicit file is configured.
backend = "local"
# key_file = "./data/deployment.key"
# audit_key_file = "./data/audit-signing.key"

[storage.object]
# Object storage is initialized for database-backed roles. The filesystem default stores below
# data_dir/objects; use "s3" for an S3-compatible bucket.
backend = "filesystem"
# directory = "./data/objects"
# s3_bucket = "scoplen-production"
# s3_region = "us-east-1"
# s3_endpoint = "https://s3.example.com"
# s3_access_key_id = "set through an environment or secret reference"
# s3_secret_access_key = "set through an environment or secret reference"
# s3_allow_http = false
