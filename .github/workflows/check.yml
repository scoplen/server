name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: scoplen/proto
          ref: a604b726881292509a8ced5ff32f718ef52f76eb
          path: proto
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Validate control-plane routes
        run: node scripts/check-control-plane-routes.mjs proto/crates/scoplen-api/openapi/v1.yaml
      - name: Test control-plane route checker
        run: node --test scripts/check-control-plane-routes.test.mjs
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Check vendored OpenSSL build prerequisite
        run: perl --version
      - name: Check Windows private-directory ACL boundaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/test-windows-data-acl.ps1'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  console:
    name: Console checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Install pnpm
        run: npm install --global pnpm@11.8.0
        working-directory: .
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check pinned public console API types
        run: node scripts/sync-console-contract.mjs --check
        working-directory: .

  personal-container:
    name: Personal container (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Test container-check cleanup boundaries
        run: node --test scripts/check-personal-container.test.mjs
      - name: Build public HTTPS Operator lifecycle driver
        run: |
          cargo build --locked -p scoplen-server --example personal_live_bootstrap
          install -m 0700 target/debug/examples/personal_live_bootstrap "$RUNNER_TEMP/personal_live_bootstrap"
          cargo clean
      - name: Verify the Personal container, SQLite upgrade and offline recovery
        run: node scripts/check-personal-container.mjs --bootstrap-driver "$RUNNER_TEMP/personal_live_bootstrap"

  postgres-schema:
    name: PostgreSQL migration schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scoplen
          POSTGRES_USER: scoplen
          POSTGRES_PASSWORD: scoplen-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoplen -d scoplen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Compare PostgreSQL and SQLite schemas
        run: cargo test -p scoplen-store --lib --features postgres-integration schema::tests::postgres_migrations_match_the_sqlite_logical_schema -- --exact
      - name: Check PostgreSQL runtime readiness and audit worker together
        run: cargo test -p scoplen-server --lib --features postgres-integration runtime::tests::postgres_
      - name: Check PostgreSQL deployment audit transactions and concurrency
        run: cargo test -p scoplen-store --test deployment_audit --features postgres-integration postgres_deployment_
      - name: Check account key admission and read consistency
        run: cargo test -p scoplen-store --test account_keys --features postgres-integration postgres_account_key_
      - name: Check PostgreSQL device access-token keyring
        run: cargo test -p scoplen-store --test device_token_keys --features postgres-integration postgres_ -- --test-threads=1
      - name: Check independent Account password probe-key storage
        run: cargo test --locked -p scoplen-store --test account_probe_key --features postgres-integration
      - name: Check accepted Account-key PUT evidence and legacy projections
        run: cargo test --locked -p scoplen-store --test accepted_account_key_put --features postgres-integration postgres_ -- --test-threads=1
      - name: Check permanent Account-id retention and capacity
        run: cargo test --locked -p scoplen-store --test account_used_ids --features postgres-integration
      - name: Check complete initial password Account storage and protected key transitions
        run: cargo test --locked -p scoplen-store --test account_bootstrap --features postgres-integration -- --test-threads=1
      - name: Check independent Account entry admission and request challenges
        run: cargo test --locked -p scoplen-store --test account_entry_admission --test account_request_challenges --features postgres-integration
      - name: Check atomic Account registration and exact terminal confirmation
        run: cargo test --locked -p scoplen-store --test account_registration --features postgres-integration -- --test-threads=1

      - name: Check durable Account password login and admission capabilities
        run: cargo test --locked -p scoplen-store --test account_password_login --features postgres-integration -- --test-threads=1
      - name: Check independent Device admission and exact historical confirmation
        run: cargo test --locked -p scoplen-store --test account_device_admission --features postgres-integration -- --test-threads=1
      - name: Check PostgreSQL operator setup, passkeys, and uncertain commits
        run: cargo test -p scoplen-store --test operator_setup --features postgres-integration postgres_
      - name: Check PostgreSQL Operator access-token keyring
        run: cargo test -p scoplen-store --test operator_token_keys --features postgres-integration postgres_
      - name: Check PostgreSQL Operator admission and replay claims
        run: cargo test -p scoplen-store --test operator_admission --features postgres-integration postgres_
      - name: Check PostgreSQL public Operator setup HTTP
        run: cargo test -p scoplen-server --lib --features postgres-integration operator_auth::tests::postgres_
      - name: Check PostgreSQL Operator sessions and authorization locks
        run: cargo test -p scoplen-store --test operator_sessions --features postgres-integration postgres_
      - name: Check populated Operator logout admission migration
        run: cargo test --locked -p scoplen-store --test operator_logout_migrations --features postgres-integration
      - name: Check bounded PostgreSQL refresh retirement and uncertain commits
        run: cargo test --locked -p scoplen-store --test refresh_retention --features postgres-integration postgres_
      - name: Check PostgreSQL Operator login and browser refresh HTTP
        run: cargo test -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::postgres_
      - name: Check PostgreSQL current Operator logout HTTP
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::logout::postgres_
      - name: Check PostgreSQL existing Device public authentication and sync
        run: cargo test -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::personal_flow::postgres_
      - name: Check PostgreSQL public ACK and atomic Personal worker retention
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::personal_flow::retention::postgres_
      - name: Check PostgreSQL current account profile and denials
        run: cargo test -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::personal_flow::account_profile::postgres_
      - name: Check PostgreSQL complete device statements, denials and consistency
        run: cargo test -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::personal_flow::account_devices::postgres_
      - name: Check PostgreSQL real TLS account-key publication, expiry and uncertain commits
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::personal_flow::key_publication::postgres_
      - name: Check PostgreSQL real TLS notification authentication and lifecycle
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration operator_auth::tests::sessions::personal_flow::notifications::postgres_
      - name: Check complete SQLite and PostgreSQL sync storage suite
        run: cargo test -p scoplen-store --test sync --features postgres-integration
      - name: Check PostgreSQL authenticated sync router
        run: cargo test -p scoplen-sync --test postgres_http --features postgres-integration
      - name: Check configurable sync limits on PostgreSQL HTTP and storage
        run: cargo test --locked -p scoplen-sync --lib --features postgres-integration http::tests::limits::postgres_configurable_sync_limits_round_trip_and_reopen -- --exact
      - name: Check PostgreSQL durable write-admission clocks, cleanup and independent devices
        run: cargo test --locked -p scoplen-store --lib --features postgres-integration sync_write_admission::tests::postgres_
      - name: Check PostgreSQL durable write-admission forward migration
        run: cargo test --locked -p scoplen-store --test sync_write_admission_migrations --features postgres-integration postgres_
      - name: Check PostgreSQL write admission through independent authenticated listeners
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration personal_sync::tests::write_admission::postgres_
      - name: Check PostgreSQL populated sync-limit forward migration
        run: cargo test --locked -p scoplen-store --test sync_limits_migrations --features postgres-integration postgres_sync_limit_forward_migration_preserves_populated_tables_and_constraints -- --exact
      - name: Check PostgreSQL metadata admission before blob materialization
        run: cargo test --locked -p scoplen-store --lib --features postgres-integration sync::read::tests::postgres_metadata_admission_precedes_blob_materialization -- --exact
      - name: Create isolated device authentication database
        run: docker exec "${{ job.services.postgres.id }}" psql -U scoplen -d scoplen -c 'CREATE DATABASE scoplen_device_auth_ci'
      - name: Check PostgreSQL device authentication and refresh transactions
        env:
          SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen_device_auth_ci
        run: cargo test -p scoplen-store --test device_authentication --features postgres-integration
      - name: Create isolated device authentication HTTP database
        run: docker exec "${{ job.services.postgres.id }}" psql -U scoplen -d scoplen -c 'CREATE DATABASE scoplen_device_auth_http_ci'
      - name: Check PostgreSQL public device authentication and Operator JWKS HTTP
        env:
          SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen_device_auth_http_ci
        run: cargo test -p scoplen-server --lib --features postgres-integration device_auth::tests::postgres_
      - name: Create isolated Personal sync authentication database
        run: docker exec "${{ job.services.postgres.id }}" psql -U scoplen -d scoplen -c 'CREATE DATABASE scoplen_personal_sync_ci'
      - name: Check PostgreSQL public Personal sync authentication
        env:
          SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen_personal_sync_ci
        run: cargo test -p scoplen-server --lib --features postgres-integration personal_sync::tests::postgres_listener_personal_sync_authentication_and_denial -- --exact
      - name: Check PostgreSQL configured limits with certified signatures
        env:
          SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen_personal_sync_ci
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration personal_sync::tests::limits::postgres_listener_configurable_sync_limits_verify_real_device_signatures -- --exact
      - name: Check PostgreSQL interactive credential envelope preservation
        env:
          SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen_personal_sync_ci
        run: cargo test --locked -p scoplen-server --lib --features postgres-integration personal_sync::tests::interactive_credential::postgres_listener_preserves_interactive_credential_envelope -- --exact
