name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: scoplen/proto
          path: proto
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Validate control-plane routes
        if: hashFiles('proto/crates/scoplen-api/openapi/v1.yaml') != ''
        run: node scripts/check-control-plane-routes.mjs proto/crates/scoplen-api/openapi/v1.yaml
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  console:
    name: Console checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: Install pnpm
        run: npm install --global pnpm@11.8.0
        working-directory: .
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck

  postgres-schema:
    name: PostgreSQL migration schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scoplen
          POSTGRES_USER: scoplen
          POSTGRES_PASSWORD: scoplen-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoplen -d scoplen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCOPLEN_TEST_DATABASE_URL: postgres://scoplen:scoplen-ci@127.0.0.1:5432/scoplen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Compare PostgreSQL and SQLite schemas
        run: cargo test -p scoplen-store --lib --features postgres-integration schema::tests::postgres_migrations_match_the_sqlite_logical_schema -- --exact
      - name: Check account key admission and read consistency
        run: cargo test -p scoplen-store --test account_keys --features postgres-integration postgres_account_key_
      - name: Check PostgreSQL personal vault ownership and concurrency
        run: cargo test -p scoplen-store --test sync --features postgres-integration postgres_personal_vault_
      - name: Check PostgreSQL shared vault creation and key scoping
        run: cargo test -p scoplen-store --test sync --features postgres-integration postgres_shared_vault_
      - name: Check PostgreSQL personal sync writes, reads, and acknowledgements
        run: cargo test -p scoplen-store --test sync --features postgres-integration postgres_personal_sync_
      - name: Check PostgreSQL API and edge readiness
        run: cargo test -p scoplen-server --lib --features postgres-integration runtime::tests::postgres_api_edge_readiness_follows_selected_database -- --exact
